services:
  - type: web
    name: thaicook
    env: python
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thaicook-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: thaicook-db
    databaseName: thaicook
    user: thaicook
    region: singapore
